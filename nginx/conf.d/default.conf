# ==================== Upstream 定義 ====================
upstream vote_backend { server vote:80; }
upstream result_backend { server result:80; }

# ==================== 主站點 (外部 80) ====================
server {
    listen 80 default_server;
    server_name _;

    # 安全性標頭
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip 壓縮
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # ==================== Vote App（根目錄） ====================
    location / {
        proxy_pass http://vote_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================== Result App（/result/） ====================
    location /result/ {
        rewrite ^/result/(.*)$ /$1 break;
        proxy_pass http://result_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================== Socket.io 即時更新 ====================
    location /result/socket.io {
        rewrite ^/result/(.*)$ /$1 break;
        proxy_pass http://result_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 方便手動檢查（可選）
    location /nginx_status {
        stub_status on;
        access_log off;
    }
}

# ==================== 給 Prometheus Exporter 專用的內部 metrics (8080) ====================
server {
    listen 8080 default_server;
    server_name _;

    location /stub_status {
        stub_status on;
        access_log off;
        allow 172.0.0.0/8;   # Docker 內部網路
        allow 127.0.0.1;
        deny all;
    }
}