# version is now using "compose spec" (Docker Compose v2+)
services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"          # 只需這一行
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - vote
      - result
    networks:
      - front-tier
    restart: unless-stopped
  vote:
    build: 
      context: ./vote
      target: dev
    depends_on:
      redis:
        condition: service_healthy
    healthcheck: 
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./vote:/usr/local/app
    networks:
      - front-tier
      - back-tier
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 256M

  result:
    build: ./result
    entrypoint: nodemon --inspect=0.0.0.0 server.js
    depends_on:
      db:
        condition: service_healthy 
    volumes:
      - ./result:/usr/local/app
    networks:
      - front-tier
      - back-tier
    restart: unless-stopped
    ports:
      - "5001:80"          # ← 加上這一行，讓外部可以直接訪問 result
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 256M
  worker:
    build:
      context: ./worker
    depends_on:
      redis:
        condition: service_healthy 
      db:
        condition: service_healthy 
    networks:
      - back-tier
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 192M

  redis:
    image: redis:alpine
    volumes:
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks:
      - back-tier
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
    networks:
      - back-tier
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 384M

networks:
  front-tier:
  back-tier:
  monitoring:
    driver: bridge

volumes:
  db-data:
  prometheus_data:
  grafana_data: