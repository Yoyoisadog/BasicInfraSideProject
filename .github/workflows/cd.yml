name: CD - Deploy to EC2 (Docker Compose + Nginx + Monitoring)

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & Push with SHA Tag
        run: |
          # Build 並 push latest
          docker compose build
          docker compose push

          # 使用小寫的 repository owner（重要修正！）
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA=${{ github.sha }}

          # 同時 push 帶 SHA 的 immutable 版本
          docker tag ghcr.io/${{ github.repository_owner }}/voting-app-vote:latest ghcr.io/${OWNER}/voting-app-vote:${SHA}
          docker tag ghcr.io/${{ github.repository_owner }}/voting-app-result:latest ghcr.io/${OWNER}/voting-app-result:${SHA}
          docker tag ghcr.io/${{ github.repository_owner }}/voting-app-worker:latest ghcr.io/${OWNER}/voting-app-worker:${SHA}

          docker push ghcr.io/${OWNER}/voting-app-vote:${SHA}
          docker push ghcr.io/${OWNER}/voting-app-result:${SHA}
          docker push ghcr.io/${OWNER}/voting-app-worker:${SHA}
          
  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: SSH Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/docker-voting-app/example-voting-app
            git pull origin main
            
            echo "=== Deploying Main Application ==="
            docker compose pull
            docker compose up -d --force-recreate
            
            echo "=== Deploying Monitoring Stack ==="
            docker compose -f monitoring/docker-compose.yml pull
            docker compose -f monitoring/docker-compose.yml up -d
            
            echo "✅ 全專案部署完成 at $(date) with SHA ${{ github.sha }}"
            echo "=== Main Application Status ==="
            docker compose ps
            echo "=== Monitoring Stack Status ==="
            docker compose -f monitoring/docker-compose.yml ps