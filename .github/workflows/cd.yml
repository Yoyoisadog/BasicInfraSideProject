name: CD - Deploy to EC2 + GHCR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 建立 Release 需要
      packages: write      # 推送 GHCR 需要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        id: lowercase
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GHCR (PAT)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==================== Build Services ====================

      - name: Build & Push vote
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-vote:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-vote:${{ github.sha }}

      - name: Build & Push result
        uses: docker/build-push-action@v6
        with:
          context: ./result
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-result:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-result:${{ github.sha }}

      - name: Build & Push worker
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-worker:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-worker:${{ github.sha }}

      # ==================== Deploy ====================

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/docker-voting-app/example-voting-app
            git pull origin main
            sed -i "s/IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env || echo "IMAGE_TAG=${{ github.sha }}" >> .env
            docker compose pull
            docker compose up -d --force-recreate
            echo "✅ Deployment completed with SHA: ${{ github.sha }}"

      # ==================== Create Release ====================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}-${{ github.sha }}
          name: "Release v${{ github.run_number }} (SHA: ${{ github.sha }})"
          body: |
            ## 🚀 Auto-deployed by GitHub Actions

            **Image Tags**:
            - `ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-vote:${{ github.sha }}`
            - `ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-result:${{ github.sha }}`
            - `ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-worker:${{ github.sha }}`

            **Deploy Time**: ${{ github.event.head_commit.timestamp }}
            **Commit**: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            查看所有 Docker Images → [GitHub Packages](https://github.com/${{ github.repository }}/pkgs/container)
          draft: false
          prerelease: false