name: CD - Deploy to EC2 + GHCR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        id: lowercase
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}     # ← 改用 PAT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push vote
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-vote:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-vote:${{ github.sha }}

      - name: Build & Push result
        uses: docker/build-push-action@v6
        with:
          context: ./result
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-result:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-result:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/docker-voting-app/example-voting-app
            git pull origin main
            sed -i "s/IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env || echo "IMAGE_TAG=${{ github.sha }}" >> .env
            docker compose pull
            docker compose up -d --force-recreate
            echo "✅ Deployment completed with SHA: ${{ github.sha }}"
