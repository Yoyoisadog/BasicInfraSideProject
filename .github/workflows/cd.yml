name: CD - Deploy to EC2 (Docker Compose + Nginx + Monitoring)

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Main Services
        run: docker compose build --no-cache

      - name: Build Monitoring Services
        run: docker compose -f monitoring/docker-compose.yml build --no-cache
        
      - name: Build & Push with SHA Tag
        run: |
          # 1. 先 build（不要 push）
          docker compose build --no-cache

          # 2. 強制轉成小寫（解決 GHCR 問題）
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA=${{ github.sha }}

          # 3. 手動 tag + push latest（使用小寫名稱）
          docker tag basicinfrasideproject-vote:latest ghcr.io/${OWNER}/voting-app-vote:latest
          docker tag basicinfrasideproject-result:latest ghcr.io/${OWNER}/voting-app-result:latest
          docker tag basicinfrasideproject-worker:latest ghcr.io/${OWNER}/voting-app-worker:latest

          docker push ghcr.io/${OWNER}/voting-app-vote:latest
          docker push ghcr.io/${OWNER}/voting-app-result:latest
          docker push ghcr.io/${OWNER}/voting-app-worker:latest

          # 4. 同時 tag + push SHA 版本（可退版用）
          docker tag ghcr.io/${OWNER}/voting-app-vote:latest ghcr.io/${OWNER}/voting-app-vote:${SHA}
          docker tag ghcr.io/${OWNER}/voting-app-result:latest ghcr.io/${OWNER}/voting-app-result:${SHA}
          docker tag ghcr.io/${OWNER}/voting-app-worker:latest ghcr.io/${OWNER}/voting-app-worker:${SHA}

          docker push ghcr.io/${OWNER}/voting-app-vote:${SHA}
          docker push ghcr.io/${OWNER}/voting-app-result:${SHA}
          docker push ghcr.io/${OWNER}/voting-app-worker:${SHA}
  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: SSH Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/docker-voting-app/example-voting-app
            git pull origin main
            
            echo "=== Deploying Main Application ==="
            docker compose pull
            docker compose up -d --force-recreate
            
            echo "=== Deploying Monitoring Stack ==="
            docker compose -f monitoring/docker-compose.yml pull
            docker compose -f monitoring/docker-compose.yml up -d
            
            echo "✅ 全專案部署完成 at $(date) with SHA ${{ github.sha }}"
            echo "=== Main Application Status ==="
            docker compose ps
            echo "=== Monitoring Stack Status ==="
            docker compose -f monitoring/docker-compose.yml ps