# YU Gacha
name: CD
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        id: lowercase
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push 多服務（latest + SHA）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-vote:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-vote:${{ github.sha }}
            ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-result:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/voting-app-result:${{ github.sha }}
          build-args: |
            IMAGE_TAG=${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/docker-voting-app/example-voting-app
            git pull origin main
            sed -i "s/IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env || echo "IMAGE_TAG=${{ github.sha }}" >> .env
            docker compose pull
            docker compose up -d --force-recreate
            echo "✅ Deployment completed with SHA: ${{ github.sha }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}-${{ github.sha }}
          name: "Release v${{ github.run_number }} (SHA: ${{ github.sha }})"
          body: |
            ## 🚀 Auto-deployed by GitHub Actions
            - **Image Tag**: `${{ github.sha }}`
            - **Deploy Time**: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
