name: CD - Deploy to EC2 (Docker Compose + Nginx + Monitoring)

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # === Build & Push Vote ===
      - name: Build and Push Vote Service
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ lower(github.repository_owner) }}/voting-app-vote:latest
            ghcr.io/${{ lower(github.repository_owner) }}/voting-app-vote:${{ github.sha }}

      # === Build & Push Result ===
      - name: Build and Push Result Service
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ lower(github.repository_owner) }}/voting-app-result:latest
            ghcr.io/${{ lower(github.repository_owner) }}/voting-app-result:${{ github.sha }}

      # === Build & Push Worker ===
      - name: Build and Push Worker Service
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ lower(github.repository_owner) }}/voting-app-worker:latest
            ghcr.io/${{ lower(github.repository_owner) }}/voting-app-worker:${{ github.sha }}
  # ==================== 部署到 EC2 ====================
  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: SSH Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/docker-voting-app/example-voting-app
            git pull origin main

            echo "=== Deploying Main Application ==="
            docker compose pull
            docker compose up -d --force-recreate

            echo "=== Deploying Monitoring Stack ==="
            docker compose -f monitoring/docker-compose.yml pull
            docker compose -f monitoring/docker-compose.yml up -d

            echo "✅ 全專案部署完成 at $(date) with SHA ${{ github.sha }}"
            echo "=== Main Application Status ==="
            docker compose ps
            echo "=== Monitoring Stack Status ==="
            docker compose -f monitoring/docker-compose.yml ps