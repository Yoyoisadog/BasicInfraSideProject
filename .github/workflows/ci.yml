name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images (multi-arch, cache)
        run: |
          # 強制轉小寫（GHCR 要求）
          IMAGE_PREFIX=$(echo "ghcr.io/${{ github.repository_owner }}/voting-app" | tr '[:upper:]' '[:lower:]')
          docker compose build --no-cache

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Smoke Test (optional)
        run: |
          # 你可以這裡啟動 compose 做簡單 curl 測試
          echo "Smoke test skipped for single-machine demo"