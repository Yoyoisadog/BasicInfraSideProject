name: CI - Build & Security Scan

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==================== Build 主應用 ====================
      - name: Build Main Application Services
        run: docker compose build --no-cache

      # ==================== Build Monitoring Stack ====================
      - name: Build Monitoring Services
        run: |
          docker compose -f monitoring/docker-compose.yml build --no-cache

      # ==================== Security Scan ====================
      - name: Trivy Vulnerability Scan (Vote Service)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/yoyoisadog/voting-app-vote:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # ==================== Smoke Test ====================
      - name: Smoke Test (Main Application)
        run: |
          docker compose up -d
          sleep 12
          curl -f http://localhost || exit 1
          docker compose down