name: CI - Build & Security Scan

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build 主應用
      - name: Build Main Application Services
        run: docker compose build --no-cache

      # Build Monitoring
      - name: Build Monitoring Services
        run: docker compose -f monitoring/docker-compose.yml build --no-cache

      # Security Scan（掃描本機 image）
      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'example-voting-app-vote:latest'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'
          